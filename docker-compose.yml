services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jdv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-jdv}
    volumes:
      - jdv_pg:/var/lib/postgresql/data
      - ./backups:/backups
    # sem porta para fora: só o app (pela rede interna do Docker) e o backup (docker compose exec) falam com o banco
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jdv}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_WHATSAPP: ${NEXT_PUBLIC_WHATSAPP:-}
        NEXT_PUBLIC_FACEBOOK: ${NEXT_PUBLIC_FACEBOOK:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jdv}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jdv}
      # chave que cifra o segredo do código no celular (obrigatória; 32+ caracteres aleatórios)
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET no .env (veja docs/deploy.md)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - jdv_uploads:/data/uploads
    # Só o proxy do servidor (Nginx/Caddy com HTTPS) acessa esta porta.
    ports:
      # 3000 já é usada por outro site no servidor; a loja fica na 3010 (troque com APP_PORT no .env)
      - "127.0.0.1:${APP_PORT:-3010}:3000"

volumes:
  jdv_pg:
  jdv_uploads:
